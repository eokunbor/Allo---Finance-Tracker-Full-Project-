<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Allo</title>
    <link rel="icon" href="/Full Website Test/Landing page/resources/color logo.png">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="login.js"></script>
</head>
<body>
    <nav class="back-nav-btn">
        <a href="/Full Website Test/Landing page/landing.html" class="btnNav btnLanding">Back Home</a>
    </nav>

    <div class="login-form">
        <div class="logo-container">
            <div class="logo">
                <img src="/Full Website Test/Landing page/resources/white logo.png" width= 70px alt="Allo Logo">
                <h1>Allo</h1>
            </div>
        </div>

        <div class="container">
            <div class="main">
                <div class="content">
                    <h2>Log In</h2>
                    <form action="" method="post">
                        <input type="text" name="" placeholder="Email" id="email" required autofocus="">
                        <input type="password" name="" placeholder="Password" id="password" required autofocus="">
                        <button class="btn" id="submit" type="submit">
                            Login
                        </button>
                    </form>
                    <p class="account">Don't Have An Account? <a href="register.html">Sign Up.</a></p>
                </div>
                <div class="form-png">
                    <img src="Images/Woman Consultant 1.jpg" class="main-img" alt="Woman Consultant">
                </div>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Allo</title>
    <link rel="icon" href="/Full Website Test/Landing page/resources/color logo.png">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="register.js"></script>
</head>
<body>
    <nav class="back-nav-btn">
        <a href="/Full Website Test/Landing page/landing.html" class="btnNav btnLanding">Back Home</a>
    </nav>
    
    <div class="login-form">
        <div class="logo-container">
            <div class="logo">
                <img src="/Full Website Test/Landing page/resources/white logo.png" width= 70px alt="Allo Logo">
                <h1>Allo</h1>
            </div>
        </div>
        
        <div class="container">
            <div class="main">
               <div class="content">
                    <h2>Create An Account</h2>
                    <form action="" method="post">
                        <input type="text" name="" placeholder="Enter Your First name" id="fName" required autofocus="">
                        <input type="text" name="" placeholder="Enter Your Last Name" id="lName" required autofocus="">
                        <input type="text" name="" placeholder="Enter Your Email" id="email" required autofocus="">
                        <input type="password" name="" placeholder="Create a Password" id="password" required autofocus="">
                        <button class="btn" id="submit" type="submit">
                            Create Account
                        </button>
                    </form>
                    <p class="account">Have An Account? <a href="login.html">Login</a></p>
               </div>
                <div class="form-png">
                <div class="form-png">
                    <img src="Images/Woman Consultant 1.jpg" class="main-img" alt="Woman Consultant">
               </div>
            </div>
        </div>
    </div>
</body>
</html>
